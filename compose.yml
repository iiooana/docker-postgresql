services:
  db_postgres:
    image: postgres
    #size of share memory in /dev/shm allocated for building docker image
    shm_size: 5mb
    ports:
      - "5432:5432"
    env_file:
      - ./db.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - projectname_db_postgres_volume:/var/lib/postgresql/data

volumes:
  projectname_db_postgres_volume: